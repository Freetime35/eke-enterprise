[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eke-enterprise"
version = "0.1.0"
description = "Enterprise platform for canonical legal knowledge engineering."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"

authors = [
    { name = "Amine", github = "Freetime35" }
]

keywords = [
    "legal",
    "eur-lex",
    "knowledge-graph",
    "knowledge-engineering",
    "regulation",
    "graph",
    "rdf",
    "compliance"
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Typing :: Typed"
]

dependencies = []

[project.optional-dependencies]

dev = [
    "pytest>=9",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

python_files = [
    "test_*.py"
]

[tool.ruff]

line-length = 100

target-version = "py311"

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.mypy]

python_version = "3.11"

strict = true

packages = [
    "eke"
]