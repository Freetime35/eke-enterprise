[build-system]
requires = [
    "setuptools>=69",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "eke-enterprise"
version = "0.0.1"
description = "Enterprise platform for canonical legal knowledge engineering."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

authors = [
    { name = "Amine" },
]

keywords = [
    "legal",
    "eur-lex",
    "knowledge-engineering",
    "knowledge-graph",
    "compliance",
    "regulation",
    "rdf",
    "graph",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.141,<1.0",
    "httpx>=0.28,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "alembic>=1.18,<2.0",
    "mypy>=1.18",
    "pytest>=9",
    "pytest-cov>=7",
    "ruff>=0.13",
]

[project.urls]
Homepage = "https://github.com/Freetime35/eke-enterprise"
Repository = "https://github.com/Freetime35/eke-enterprise"
Issues = "https://github.com/Freetime35/eke-enterprise/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eke = ["py.typed"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = [
    "B008",
]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["eke"]
explicit_package_bases = true
warn_unused_configs = true
show_error_codes = true
pretty = true
